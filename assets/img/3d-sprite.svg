<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- ============ GRADIENTS (flat-3D look) ============ -->
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC8F5"/><stop offset="1" stop-color="#2E93D8"/></linearGradient>
    <linearGradient id="g-sky-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FA9E6"/><stop offset="1" stop-color="#1E6FAE"/></linearGradient>
    <linearGradient id="g-sunny" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD968"/><stop offset="1" stop-color="#F5AC17"/></linearGradient>
    <linearGradient id="g-sunny-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7C44A"/><stop offset="1" stop-color="#DE9100"/></linearGradient>
    <linearGradient id="g-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A7E"/><stop offset="1" stop-color="#F5533F"/></linearGradient>
    <linearGradient id="g-coral-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4715F"/><stop offset="1" stop-color="#D93A26"/></linearGradient>
    <linearGradient id="g-mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD9B0"/><stop offset="1" stop-color="#1FA87B"/></linearGradient>
    <linearGradient id="g-mint-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45C394"/><stop offset="1" stop-color="#148A60"/></linearGradient>
    <linearGradient id="g-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FE4EE"/><stop offset="1" stop-color="#0BB6C4"/></linearGradient>
    <linearGradient id="g-cyan-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2CCEDB"/><stop offset="1" stop-color="#0899A6"/></linearGradient>
    <linearGradient id="g-lav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B3A7FB"/><stop offset="1" stop-color="#7B68EE"/></linearGradient>
    <linearGradient id="g-lav-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9483F5"/><stop offset="1" stop-color="#6150DB"/></linearGradient>
    <linearGradient id="g-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E6E99"/><stop offset="1" stop-color="#0B4364"/></linearGradient>
    <linearGradient id="g-navy-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B587E"/><stop offset="1" stop-color="#082F47"/></linearGradient>
    <linearGradient id="g-wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4BE083"/><stop offset="1" stop-color="#1FBF5B"/></linearGradient>
    <linearGradient id="g-hero-orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FE4EE"/><stop offset="1" stop-color="#2E93D8"/></linearGradient>

    <!-- ============ SPARKLE ============ -->
    <symbol id="i-spark" viewBox="0 0 100 100">
      <path d="M50 6 L59 41 L94 50 L59 59 L50 94 L41 59 L6 50 L41 41 Z" fill="url(#g-sunny)"/>
      <circle cx="50" cy="50" r="12" fill="#FFF7DC" opacity=".85"/>
    </symbol>

    <symbol id="i-spark-sm" viewBox="0 0 100 100">
      <path d="M50 14 L57 43 L86 50 L57 57 L50 86 L43 57 L14 50 L43 43 Z" fill="url(#g-sunny)"/>
    </symbol>

    <!-- ============ BUBBLES ============ -->
    <symbol id="i-bubble" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="url(#g-hero-orb)" opacity=".5"/>
      <ellipse cx="38" cy="38" rx="9" ry="6" fill="#FFFFFF" opacity=".7" transform="rotate(-25 38 38)"/>
      <circle cx="74" cy="26" r="7" fill="url(#g-hero-orb)" opacity=".6"/>
      <circle cx="20" cy="74" r="5" fill="url(#g-hero-orb)" opacity=".45"/>
    </symbol>

