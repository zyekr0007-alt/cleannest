      <path d="M22 46 Q22 30 38 30 L62 30 Q78 30 78 46 L78 58 L22 58 Z" fill="url(#g-cyan)"/>
      <path d="M22 58 L78 58 L74 74 Q72 80 64 80 L36 80 Q28 80 26 74 Z" fill="url(#g-cyan-deep)"/>
