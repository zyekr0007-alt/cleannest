      <path d="M16 44 Q16 32 26 32 L74 32 Q84 32 84 44 L84 66 L16 66 Z" fill="url(#g-coral)"/>
      <path d="M16 52 L84 52 L84 64 Q84 72 74 72 L26 72 Q16 72 16 64 Z" fill="url(#g-coral-deep)"/>
      <rect x="24" y="60" width="52" height="8" rx="4" fill="#FFE9E6"/>
      <rect x="40" y="42" width="20" height="10" rx="5" fill="#FFE9E6" opacity=".8"/>
      <ellipse cx="36" cy="38" rx="7" ry="4.5" fill="#FFFFFF" opacity=".55" transform="rotate(-20 36 38)"/>
