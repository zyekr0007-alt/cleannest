      <ellipse cx="28" cy="54" rx="12" ry="24" fill="url(#g-mint-deep)"/>
      <ellipse cx="28" cy="54" rx="7" ry="16" fill="url(#g-mint)"/>
      <ellipse cx="28" cy="54" rx="3" ry="7" fill="#E1F7EE"/>
      <rect x="28" y="30" width="44" height="48" rx="8" fill="url(#g-mint)"/>
      <path d="M34 40 L66 40 M34 50 L66 50 M34 60 L66 60 M34 70 L66 70" stroke="#E1F7EE" stroke-width="3"/>
      <rect x="72" y="34" width="12" height="40" rx="6" fill="url(#g-mint-deep)"/>
      <path d="M76 38 L80 72 M82 38 L86 72" stroke="#E1F7EE" stroke-width="2.5"/>
      <ellipse cx="40" cy="36" rx="6" ry="4" fill="#FFFFFF" opacity=".5"/>
