      <rect x="60" y="14" width="8" height="18" rx="4" fill="url(#g-navy)"/>
      <circle cx="64" cy="10" r="4" fill="url(#g-coral)"/>
      <ellipse cx="36" cy="36" rx="7" ry="4.5" fill="#FFFFFF" opacity=".6" transform="rotate(-20 36 36)"/>
    </symbol>

