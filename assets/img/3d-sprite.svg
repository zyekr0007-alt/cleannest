      <circle cx="160" cy="150" r="82" fill="url(#g-hero-orb)" opacity=".5"/>
      <circle cx="160" cy="150" r="66" fill="#FFFFFF" opacity=".95"/>
      <!-- house inside -->
      <path d="M160 108 L208 144 L196 144 L196 186 L124 186 L124 144 L112 144 Z" fill="url(#g-sky)"/>
      <path d="M160 108 L208 144 L112 144 Z" fill="url(#g-sky-deep)"/>
      <rect x="148" y="158" width="24" height="28" rx="4" fill="#FFFFFF"/>
      <circle cx="160" cy="186" r="4" fill="#0B4364" opacity=".45"/>
      <ellipse cx="146" cy="128" rx="9" ry="6" fill="#FFFFFF" opacity=".6" transform="rotate(-20 146 128)"/>
      <!-- sparkles (outer ring, consistent spacing) -->
      <path d="M52 50 L56 66 L72 70 L56 74 L52 90 L48 74 L32 70 L56 66 Z" fill="url(#g-sunny)"/>
      <circle cx="52" cy="70" r="5" fill="#FFF7DC" opacity=".85"/>
      <path d="M270 34 L272.5 45 L284 47.5 L272.5 50 L270 61 L267.5 50 L256 47.5 L267.5 45 Z" fill="url(#g-sunny)"/>
      <path d="M290 112 L292 120 L300 122 L292 124 L290 132 L288 124 L280 122 L288 120 Z" fill="url(#g-coral)"/>
      <path d="M30 160 L31.5 167 L39 168.5 L31.5 170 L30 177 L28.5 170 L21 168.5 L28.5 167 Z" fill="url(#g-cyan)"/>
      <!-- floating bubbles -->
      <circle cx="78" cy="198" r="13" fill="#5FE4EE" opacity=".55"/>
      <ellipse cx="73" cy="193" rx="4" ry="3" fill="#FFFFFF" opacity=".8" transform="rotate(-25 73 193)"/>
      <circle cx="244" cy="186" r="9" fill="#7EC8F5" opacity=".55"/>
      <ellipse cx="241" cy="183" rx="3" ry="2.2" fill="#FFFFFF" opacity=".8" transform="rotate(-25 241 183)"/>
      <circle cx="252" cy="120" r="6" fill="#B3A7FB" opacity=".6"/>
      <circle cx="58" cy="120" r="5" fill="#FFD968" opacity=".7"/>
      <!-- floating spray bottle (bottom right, fully in front) -->
      <g transform="translate(250 222) rotate(14)">
        <rect x="-11" y="-26" width="22" height="34" rx="9" fill="url(#g-coral)"/>
        <rect x="-11" y="-26" width="22" height="12" rx="6" fill="url(#g-coral-deep)"/>
        <path d="M0 -26 L0 -36 M0 -36 L-5 -32 M0 -36 L5 -32" stroke="#0B4364" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="-5" cy="-20" rx="5" ry="3" fill="#FFFFFF" opacity=".6"/>
      </g>
      <!-- floating broom (top left, fully in front) -->
      <g transform="translate(64 96) rotate(-16)">
        <rect x="-4" y="-40" width="8" height="30" rx="4" fill="url(#g-navy)"/>
        <path d="M-10 -10 L10 -10 L16 8 Q0 14 -16 8 Z" fill="url(#g-sunny-deep)"/>
        <path d="M-12 -4 L-18 10 M-8 -2 L-12 14 M0 0 L0 16 M8 -2 L12 14 M12 -4 L18 10" stroke="#DE9100" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="-2" cy="-32" rx="4" ry="2.5" fill="#FFFFFF" opacity=".5" transform="rotate(-16 -2 -32)"/>
      </g>
      <!-- star badge -->
      <g transform="translate(150 36)">
        <circle cx="0" cy="0" r="26" fill="url(#g-coral)"/>
        <path d="M0 -14 L3.4 -4.6 L13 -4.6 L5.3 1.4 L8 11 L0 5.6 L-8 11 L-5.3 1.4 L-13 -4.6 L-3.4 -4.6 Z" fill="#FFFFFF"/>
      </g>
    </symbol>
  </defs>
</svg>
