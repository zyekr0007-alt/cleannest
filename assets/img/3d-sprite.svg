      <rect x="28" y="18" width="44" height="66" rx="6" fill="url(#g-navy)"/>
      <rect x="36" y="26" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="54" y="26" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="36" y="42" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="54" y="42" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="36" y="58" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="54" y="58" width="10" height="9" rx="2" fill="#9FD4F0"/>
      <rect x="44" y="72" width="12" height="12" rx="2" fill="#9FD4F0"/>
