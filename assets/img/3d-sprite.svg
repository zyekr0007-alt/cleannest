      <rect x="38" y="26" width="24" height="48" rx="10" fill="url(#g-cyan)"/>
      <rect x="38" y="26" width="24" height="16" rx="8" fill="url(#g-cyan-deep)"/>
      <rect x="32" y="70" width="36" height="8" rx="4" fill="#0B4364" opacity=".85"/>
