      <path d="M40 50 L60 50 L68 70 Q50 78 32 70 Z" fill="url(#g-sunny-deep)"/>
      <path d="M38 56 L30 72 M42 58 L36 76 M50 60 L50 78 M58 58 L64 76 M62 56 L70 72" stroke="#DE9100" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="52" cy="22" rx="6" ry="4" fill="#FFFFFF" opacity=".6" transform="rotate(-25 52 22)"/>
