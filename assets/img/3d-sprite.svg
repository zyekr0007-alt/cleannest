      <ellipse cx="50" cy="88" rx="30" ry="6" fill="#082F47" opacity=".14"/>
      <rect x="14" y="26" width="72" height="46" rx="8" fill="#F4F8FB"/>
      <rect x="14" y="26" width="72" height="14" rx="7" fill="url(#g-sky-deep)"/>
      <path d="M22 52 L78 52" stroke="#D7E6F1" stroke-width="3"/>
      <rect x="22" y="56" width="8" height="10" rx="2" fill="#C9DCEA"/>
      <rect x="34" y="56" width="8" height="10" rx="2" fill="#C9DCEA"/>
      <rect x="46" y="56" width="8" height="10" rx="2" fill="#C9DCEA"/>
      <rect x="58" y="56" width="8" height="10" rx="2" fill="#C9DCEA"/>
      <rect x="70" y="56" width="8" height="10" rx="2" fill="#C9DCEA"/>
      <ellipse cx="30" cy="32" rx="7" ry="4" fill="#FFFFFF" opacity=".7"/>
      <path d="M62 84 L62 78 M58 86 L58 80 M66 86 L66 80" stroke="#0B4364" stroke-width="3" stroke-linecap="round" opacity=".45"/>
