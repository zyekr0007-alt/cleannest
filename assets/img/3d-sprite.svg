      <circle cx="26" cy="56" r="3" fill="#5FE4EE"/>
      <circle cx="34" cy="62" r="2.5" fill="#5FE4EE"/>
      <ellipse cx="44" cy="32" rx="6" ry="4" fill="#FFFFFF" opacity=".6"/>
    </symbol>

    <!-- ============ SHIELD/TRUST (mint) ============ -->
    <symbol id="i-shield" viewBox="0 0 100 100">
      <path d="M50 8 L86 24 L86 52 Q86 76 50 92 Q14 76 14 52 L14 24 Z" fill="url(#g-mint)"/>
