    <!-- ============ CALENDAR (sunny) ============ -->
    <symbol id="i-calendar" viewBox="0 0 100 100">
      <ellipse cx="50" cy="88" rx="30" ry="6" fill="#082F47" opacity=".14"/>
      <rect x="20" y="26" width="60" height="56" rx="10" fill="#F7FAFD"/>
      <rect x="20" y="26" width="60" height="56" rx="10" fill="none" stroke="#D7E6F1" stroke-width="2"/>
      <rect x="20" y="26" width="60" height="16" rx="8" fill="url(#g-coral)"/>
      <rect x="26" y="18" width="6" height="14" rx="3" fill="#0B4364" opacity=".8"/>
      <rect x="68" y="18" width="6" height="14" rx="3" fill="#0B4364" opacity=".8"/>
      <rect x="30" y="52" width="18" height="12" rx="4" fill="url(#g-sunny)"/>
      <circle cx="60" cy="58" r="7" fill="url(#g-cyan)"/>
      <ellipse cx="34" cy="32" rx="6" ry="3.5" fill="#FFFFFF" opacity=".7"/>
    </symbol>

    <!-- ============ WHATSAPP (for CTA chips) ============ -->
    <symbol id="i-wa" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="url(#g-wa)"/>
      <path d="M50 22a28 28 0 0 0-24 42l-4 14 14.5-4.2A28 28 0 1 0 50 22zm-9.5 17.5c1-.4 2-.3 2.8 1l2.6 4.4c.4.7.3 1.5-.2 2.1l-1.5 1.9c-.5.6-.6 1.4-.2 2.1 1.2 2.2 4.4 6 8 7.6.7.4 1.5.3 2.1-.3l2-2.1c.6-.6 1.4-.7 2.1-.3l4.6 2.6c.8.4 1.2 1.3 1 2.2-.6 2.9-3.3 4.7-6 4.4-5.7-.7-10.8-4.4-13.5-7.8-2.9-3.6-4.6-8-4.6-12.4 0-2.3 1.2-3.5 2.3-4.4z" fill="#FFFFFF"/>
    </symbol>

    <!-- ============ HERO SCENE (composed) ============ -->
    <symbol id="i-hero-scene" viewBox="0 0 320 300">
      <!-- ground shadow -->
      <ellipse cx="160" cy="262" rx="118" ry="14" fill="#082F47" opacity=".18"/>
      <!-- outer glow orbs -->
