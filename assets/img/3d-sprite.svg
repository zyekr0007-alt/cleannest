      <path d="M50 14 L88 46 L82 46 L82 82 L18 82 L18 46 L12 46 Z" fill="url(#g-sky)"/>
      <path d="M50 14 L88 46 L12 46 Z" fill="url(#g-sky-deep)"/>
      <rect x="42" y="56" width="16" height="26" rx="3" fill="#FFFFFF" opacity=".92"/>
      <circle cx="50" cy="82" r="3" fill="#0B4364" opacity=".5"/>
      <ellipse cx="36" cy="30" rx="7" ry="4.5" fill="#FFFFFF" opacity=".55" transform="rotate(-20 36 30)"/>
    </symbol>

    <!-- ============ KITCHEN (sunny) — pot with steam ============ -->
    <symbol id="i-kitchen" viewBox="0 0 100 100">
      <ellipse cx="50" cy="88" rx="30" ry="6" fill="#082F47" opacity=".14"/>
      <rect x="24" y="42" width="52" height="38" rx="10" fill="url(#g-sunny)"/>
      <rect x="24" y="42" width="52" height="10" rx="5" fill="url(#g-sunny-deep)"/>
      <path d="M14 46 L34 46 L30 40 L70 40 L66 46 L86 46 L86 52 L14 52 Z" fill="url(#g-sunny-deep)"/>
      <circle cx="50" cy="38" r="6" fill="#FFF7DC"/>
      <rect x="36" y="56" width="28" height="8" rx="4" fill="#FFF7DC" opacity=".7"/>
      <path d="M36 26 Q40 20 44 26 M50 24 Q54 18 58 24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9"/>
      <circle cx="72" cy="30" r="2.5" fill="#FFD968"/>
      <ellipse cx="36" cy="48" rx="6" ry="4" fill="#FFFFFF" opacity=".5"/>
    </symbol>

