      <rect x="36" y="34" width="28" height="10" rx="4" fill="#FFF4D9"/>
      <rect x="36" y="50" width="28" height="10" rx="4" fill="#FFF4D9"/>
      <rect x="36" y="66" width="28" height="10" rx="4" fill="#FFF4D9"/>
      <ellipse cx="36" cy="20" rx="7" ry="4" fill="#FFFFFF" opacity=".6"/>
